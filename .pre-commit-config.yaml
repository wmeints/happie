repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: ty check
        language: python
        additional_dependencies:
          - "fastmcp>=3.4.7"
          - "httpx>=0.28.1"
          - "pytest>=9.1.1"
          - "ty==0.0.75"
          - "typer>=0.27.1"
        types: [python]
      - id: conventional-commits
        name: conventional-commits
        entry: conventional-pre-commit --strict
        language: python
        additional_dependencies: ["conventional-pre-commit==4.4.0"]
        stages: [commit-msg]
